<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スカスク相談室 — スカイスクレイパー</title>
<link rel="preload" as="image" href="img/kaicho-256.png">
<link rel="preload" as="image" href="img/shacho-256.png">
<style>
/* ══ トークン ══════════════════════════════════════════════
   配色は sky-scraper.jp から採取（赤 #D91000 / 濃赤 #990C00 /
   文字 #333 / 淡赤 #FEF6F5）。話者の色分けはロゴの赤×黄から。 */
:root{
  color-scheme:light;
  --brand:#D91000;
  --brand-deep:#990C00;
  --brand-wash:rgba(217,16,0,.08);
  --paper:#FBF4F3;
  --surface:#FFFFFF;
  --surface-2:#F4EEED;
  --ink:#333333;
  --ink-2:#6E6664;
  --ink-3:#A69E9D;
  --line:#EADFDD;
  --kaicho:#C41200;
  --kaicho-bg:#FDEEEC;
  --shacho:#9A6300;
  --shacho-bg:#FFF6E2;
  --alert:#8A5E14;
  --alert-bg:#FBF2DF;
  --shadow:0 1px 2px rgba(80,30,25,.07), 0 10px 30px rgba(80,30,25,.06);
  --sans:"ヒラギノ角ゴ Pro","Hiragino Kaku Gothic Pro","Hiragino Sans","Yu Gothic",YuGothic,メイリオ,Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --brand:#FF5A45;
    --brand-deep:#FF8371;
    --brand-wash:rgba(255,90,69,.13);
    --paper:#171110;
    --surface:#211A19;
    --surface-2:#2C2422;
    --ink:#F0EAE8;
    --ink-2:#B5AAA7;
    --ink-3:#8A7E7B;
    --line:#382E2C;
    --kaicho:#FF7461;
    --kaicho-bg:#341F1C;
    --shacho:#F2B444;
    --shacho-bg:#2F2513;
    --alert:#E0B356;
    --alert-bg:#2C2415;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:#FF5A45; --brand-deep:#FF8371; --brand-wash:rgba(255,90,69,.13);
  --paper:#171110; --surface:#211A19; --surface-2:#2C2422;
  --ink:#F0EAE8; --ink-2:#B5AAA7; --ink-3:#8A7E7B; --line:#382E2C;
  --kaicho:#FF7461; --kaicho-bg:#341F1C;
  --shacho:#F2B444; --shacho-bg:#2F2513;
  --alert:#E0B356; --alert-bg:#2C2415;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
html,body{height:100%}
/* 横スクロールを完全に殺す（iPhoneでキーボード開閉時に横へずれるのを防ぐ） */
html,body{overflow-x:hidden; max-width:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.75;
  -webkit-font-smoothing:antialiased; text-size-adjust:100%;
  overscroll-behavior-x:none;
}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
img{display:block; max-width:100%}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:8px}

.app{
  max-width:760px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column; background:var(--surface);
  box-shadow:0 0 0 1px var(--line);
}

/* ══ ヘッダー ══════════════════════════════════════════════ */
header{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.bar{display:flex; align-items:center; gap:11px; padding:13px 18px 11px}
.mark{
  font-size:19px; font-weight:800; letter-spacing:-.02em; line-height:1;
  color:var(--ink);
  background:none; border:0; padding:0; font-family:inherit; cursor:pointer;
}
.mark:hover em{text-decoration:underline}
.mark{white-space:nowrap}
@media (max-width:430px){ .mark{font-size:17px} .brandline{font-size:9px} }
.mark em{font-style:normal; color:var(--brand)}
.brandline{
  font-size:10px; font-weight:800; letter-spacing:.1em; color:var(--brand);
  border-left:1px solid var(--line); padding-left:11px; line-height:1.3;
}
.brandline span{display:block; font-size:8.5px; font-weight:600; color:var(--ink-3); letter-spacing:.06em}
.bar .spacer{flex:1}
.iconbtn{
  width:34px; height:34px; border-radius:9px; display:grid; place-items:center;
  color:var(--ink-2); border:1px solid var(--line);
}
.iconbtn:hover{background:var(--surface-2); color:var(--brand)}

/* 話す相手 */
.pickers{display:flex; gap:6px; padding:0 16px 12px}
.pick{
  flex:1 1 0; min-width:0; display:flex; align-items:center; gap:7px;
  background:var(--surface-2); border-radius:999px; padding:4px 10px 4px 4px;
  transition:background .15s, box-shadow .15s;
  box-shadow:inset 0 0 0 1.5px transparent;
}
.pick .av{width:34px; height:34px; border-radius:50%; flex:none; background:#fff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.pick .txt{min-width:0; text-align:left}
.pick b{display:block; font-size:12px; font-weight:700; line-height:1.25; white-space:nowrap}
.pick i{display:block; font-size:9.5px; font-style:normal; color:var(--ink-3); line-height:1.25; white-space:nowrap}
.pick[aria-pressed="true"]{background:var(--surface)}
.pick[aria-pressed="true"][data-who="kaicho"]{box-shadow:inset 0 0 0 1.5px var(--kaicho)}
.pick[aria-pressed="true"][data-who="kaicho"] b{color:var(--kaicho)}
.pick[aria-pressed="true"][data-who="shacho"]{box-shadow:inset 0 0 0 1.5px var(--shacho)}
.pick[aria-pressed="true"][data-who="shacho"] b{color:var(--shacho)}
.pick[aria-pressed="true"][data-who="auto"]{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.pick[data-who="auto"]{flex:0 0 auto; padding:4px 14px; justify-content:center}
.pick[data-who="auto"] .txt{text-align:center}
.pick[data-who="auto"] b{font-size:12px}
.pick[data-who="auto"] i{color:var(--ink-3)}

/* モード */
.modes{display:flex; gap:24px; padding:0 18px; border-top:1px solid var(--line)}
.mode{
  padding:11px 0 9px; font-size:13.5px; font-weight:700; color:var(--ink-3);
  border-bottom:2.5px solid transparent; margin-bottom:-1px;
}
.mode[aria-selected="true"]{color:var(--brand); border-bottom-color:var(--brand)}
/* 会長の言葉: AI相談とは別要素なので右に離し、金色のグラデーション文字に */
.mode[data-mode="kotoba"]{
  margin-left:auto;
  background:linear-gradient(120deg, #A67C00 0%, #E6B422 35%, #FFE28A 52%, #D4AF37 70%, #8C6D1F 100%);
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
.mode[data-mode="kotoba"][aria-selected="true"]{border-bottom-color:#D4AF37}

/* ══ 会話 ══════════════════════════════════════════════════ */
main{flex:1; padding:22px 18px 10px; display:flex; flex-direction:column; gap:18px}

.intro{text-align:center; padding:22px 4px 6px}
.intro .avs{display:flex; justify-content:center; margin-bottom:18px}
.intro .avs .ring{
  width:92px; height:92px; border-radius:50%; background:#fff; overflow:hidden;
  box-shadow:0 0 0 3px var(--surface), 0 6px 18px rgba(80,30,25,.12);
  flex:none; position:relative;
}
.intro .avs .ring:last-child{margin-left:-16px}
.intro .avs .ring video,
.intro .avs .ring img{
  width:100%; height:100%; object-fit:cover; display:block;
  /* 全身動画なので顔まわりに寄せる */
  transform:scale(1.85); transform-origin:50% 12%;
}
.intro h1{
  font-size:22px; font-weight:800; letter-spacing:-.01em; margin:0 0 10px;
  color:var(--ink); text-wrap:balance;
}
.intro .lead{margin:0 auto; font-size:13.5px; color:var(--ink-2); max-width:30em}
.intro .tag{
  display:inline-block; margin-bottom:14px; font-size:10.5px; font-weight:700;
  letter-spacing:.09em; color:var(--brand-deep);
  background:var(--brand-wash); border-radius:999px; padding:4px 13px;
}
/* 1行に1つずつ縦に並べる。入れ替えボタンは右上に縦書きで固定 */
.chips{
  display:flex; flex-direction:column; align-items:center; gap:7px; margin-top:22px;
  position:relative; padding:0 46px;
}
.chip{
  background:var(--brand-wash); color:var(--brand-deep); border-radius:999px;
  padding:7px 15px; font-size:12.5px; font-weight:600; transition:.13s;
  max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chip:hover{background:var(--brand); color:#fff}
.chip.reroll{
  position:absolute; top:0; right:2px;
  writing-mode:vertical-rl;
  background:transparent; border:1.5px dashed var(--brand); color:var(--brand);
  font-weight:700; font-size:11px; letter-spacing:.14em;
  padding:13px 6px; white-space:nowrap; overflow:visible; text-overflow:clip;
}
.chip.reroll:hover{background:var(--brand-wash); color:var(--brand-deep)}

/* ══ 会長の言葉 ═══════════════════════════════════════════ */
.kotoba{padding:4px 0 20px}
.kotoba .khead{text-align:center; margin:14px 0 26px}
.kotoba .khead h1{font-size:20px; font-weight:800; margin:0 0 6px; color:var(--ink)}
.kotoba .khead p{font-size:12.5px; color:var(--ink-3); margin:0}
.kotoba section{margin-bottom:28px}
.kotoba h2{
  font-size:13px; font-weight:800; color:var(--brand-deep);
  border-left:4px solid var(--brand); padding-left:10px; margin:0 0 12px;
}
.kcard{
  background:var(--surface-2); border-radius:14px; padding:13px 16px; margin-bottom:9px;
}
.kcard summary{
  list-style:none; cursor:pointer; font-size:14px; font-weight:700; color:var(--ink);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.kcard summary::-webkit-details-marker{display:none}
.kcard summary::after{content:'＋'; color:var(--brand); font-weight:700; flex:none}
.kcard[open] summary::after{content:'−'}
.kcard p{font-size:13.5px; line-height:1.85; color:var(--ink-2); margin:10px 0 0}
.kcard .ksrc{
  display:inline-block; margin-top:7px; font-size:10px; font-weight:700;
  color:var(--brand-deep); background:var(--brand-wash); border-radius:999px; padding:2px 9px;
}

.msg{display:flex; gap:10px; align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .av{width:38px; height:38px; border-radius:50%; flex:none; margin-top:20px; background:#fff; box-shadow:0 0 0 1.5px var(--line)}
.msg.kaicho .av{box-shadow:0 0 0 1.5px var(--kaicho)}
.msg.shacho .av{box-shadow:0 0 0 1.5px var(--shacho)}
.body{min-width:0; max-width:min(86%,32em)}
.who{font-size:11px; font-weight:700; letter-spacing:.03em; margin:0 0 4px 3px}
.msg.kaicho .who{color:var(--kaicho)}
.msg.shacho .who{color:var(--shacho)}
.bubble{
  padding:12px 16px; border-radius:16px; font-size:15px;
  white-space:pre-wrap; word-break:break-word; line-height:1.7;
}
.msg.me .bubble{background:var(--surface-2); border-bottom-right-radius:5px}
.msg.kaicho .bubble{background:var(--kaicho-bg); border-bottom-left-radius:5px}
.msg.shacho .bubble{background:var(--shacho-bg); border-bottom-left-radius:5px}
.msg.me .body{margin-top:20px}

.dots span{
  display:inline-block; width:6px; height:6px; margin-right:4px; border-radius:50%;
  background:currentColor; opacity:.35; animation:blink 1.3s infinite;
}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.22} 30%{opacity:.8}}
@media (prefers-reduced-motion:reduce){ .dots span{animation:none} }

.handoff{
  border:1px solid color-mix(in srgb, var(--alert) 32%, var(--line));
  background:var(--alert-bg); border-radius:16px; padding:16px 18px;
}
.handoff h3{margin:0 0 8px; font-size:14px; font-weight:700; color:var(--alert)}
.handoff p{margin:0 0 12px; font-size:13.5px; color:var(--ink-2)}
.handoff dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px}
.handoff dt{color:var(--ink-3); white-space:nowrap}
.handoff dd{margin:0; font-variant-numeric:tabular-nums; font-weight:600}

.error{
  border:1px solid var(--line); background:var(--surface-2); border-radius:16px;
  padding:14px 17px; font-size:13.5px; color:var(--ink-2);
}
.error code{font-size:11.5px; background:var(--paper); padding:1px 6px; border-radius:5px; word-break:break-all}

/* ══ 入力 ══════════════════════════════════════════════════ */
footer{
  position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  padding:11px 18px calc(9px + env(safe-area-inset-bottom));
}
.composer{display:flex; gap:9px; align-items:flex-end}
textarea{
  /* 16px未満だとiPhoneがフォーカス時に自動ズームして画面が横にずれる */
  flex:1; resize:none; font:inherit; font-size:16px; color:var(--ink);
  background:var(--surface-2); border:1.5px solid transparent; border-radius:22px;
  padding:11px 16px; max-height:140px; min-height:46px; line-height:1.6;
  transition:border-color .15s;
}
textarea:focus{outline:none; border-color:var(--brand)}
textarea::placeholder{color:var(--ink-3)}
.send{
  width:46px; height:46px; flex:none; border-radius:50%;
  background:var(--brand); color:#fff; display:grid; place-items:center;
  transition:.15s;
}
.send:hover:not(:disabled){background:var(--brand-deep)}
.send:disabled{opacity:.28; cursor:default}
.note{
  font-size:10px; color:var(--ink-3); text-align:center; margin:9px 0 0; line-height:1.6;
}
.note b{color:var(--brand); font-weight:800; letter-spacing:.06em}

/* ══ 合言葉画面（初回のみ） ══════════════════════════════════ */
#gate{
  position:fixed; inset:0; z-index:100; background:var(--paper);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#gate[hidden]{display:none}
.gatecard{
  background:var(--surface); border-radius:20px; box-shadow:var(--shadow);
  padding:34px 28px; max-width:360px; width:100%; text-align:center;
}
.gatecard .gmark{font-size:22px; font-weight:800; letter-spacing:-.02em}
.gatecard .gmark em{font-style:normal; color:var(--brand)}
.gatecard .glead{font-size:12.5px; color:var(--ink-2); margin:12px 0 20px; line-height:1.8}
.gatecard input{
  width:100%; font:inherit; font-size:16px; text-align:center; letter-spacing:.08em;
  padding:11px 14px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--surface-2); color:var(--ink);
}
.gatecard input:focus{outline:none; border-color:var(--brand)}
.gatecard button{
  width:100%; margin-top:11px; padding:12px; border-radius:12px;
  background:var(--brand); color:#fff; font-weight:700; font-size:14.5px;
}
.gatecard button:hover{background:var(--brand-deep)}
.gatecard .gerr{font-size:12px; color:var(--brand); margin:12px 0 0; font-weight:600}

/* ══ 設定 ══════════════════════════════════════════════════ */
dialog{
  border:none; border-radius:18px; padding:0; max-width:420px; width:calc(100% - 32px);
  background:var(--surface); color:var(--ink); box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(40,10,8,.5)}
.dlg{padding:24px}
.dlg h2{margin:0 0 4px; font-size:16px; font-weight:800}
.dlg .lead{margin:0 0 18px; font-size:12.5px; color:var(--ink-3)}
.dlg label{display:block; font-size:12px; font-weight:600; color:var(--ink-2); margin-bottom:6px}
.dlg input{
  width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:10px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink);
}
.dlg input:focus{outline:none; border-color:var(--brand)}
.dlg .hint{font-size:11.5px; color:var(--ink-3); margin:8px 0 0; line-height:1.65}
.dlg .hint code{background:var(--surface-2); padding:1px 5px; border-radius:4px}
.dlg .row{display:flex; gap:9px; margin-top:22px}
.dlg .row button{flex:1; padding:11px; border-radius:10px; background:var(--surface-2); font-weight:600}
.dlg .row button.primary{background:var(--brand); color:#fff}
.status{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2); margin-top:18px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:none}
.dot.ok{background:#2E9E6B}
.dot.ng{background:var(--brand)}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="bar">
      <button class="mark" id="btn-home" type="button" aria-label="最初の画面に戻る"><em>スカスク</em>相談室</button>
      <span class="brandline">skyscraper<span>GO☆FIGHT☆WIN！</span></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="btn-home2" aria-label="最初の画面に戻る" title="最初に戻る">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
        </svg>
      </button>
      <button class="iconbtn" id="btn-settings" aria-label="設定">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <div class="pickers" role="group" aria-label="話す相手">
      <button class="pick" data-who="kaicho" aria-pressed="false">
        <img class="av" src="img/kaicho-256.png" alt="">
        <span class="txt"><b>西牧会長</b><i>将来とお金</i></span>
      </button>
      <button class="pick" data-who="shacho" aria-pressed="false">
        <img class="av" src="img/shacho-256.png" alt="">
        <span class="txt"><b>諸沢社長</b><i>今日のこと</i></span>
      </button>
      <button class="pick" data-who="auto" aria-pressed="true">
        <span class="txt"><b>おまかせ</b><i>自動で選ぶ</i></span>
      </button>
    </div>

    <div class="modes" role="tablist">
      <button class="mode" role="tab" data-mode="chat" aria-selected="true">相談する</button>
      <button class="mode" role="tab" data-mode="praise" aria-selected="false">ほめてもらう</button>
      <button class="mode" role="tab" data-mode="kotoba" aria-selected="false">会長の言葉</button>
    </div>
  </header>

  <main id="log">
    <div class="intro" id="intro">
      <div class="avs">
        <span class="ring"><video class="idle" data-who="kaicho" src="img/pop/kaicho-idle.mp4" poster="img/pop/kaicho-full.png"
               autoplay loop muted playsinline aria-label="西牧会長"></video></span>
        <span class="ring"><video class="idle" data-who="shacho" src="img/pop/shacho-idle.mp4" poster="img/pop/shacho-full.png"
               autoplay loop muted playsinline aria-label="諸沢社長"></video></span>
      </div>
      <span class="tag" id="intro-tag">人生にスパイスを</span>
      <h1 id="intro-title">どうした、話してみな。</h1>
      <p class="lead" id="intro-lead">仕事のこと、将来のこと、今日しんどかったこと。<br>なんでも書いて下さい。ここでの話は誰にも見られません。</p>
      <div class="chips" id="chips"></div>
    </div>
  </main>

  <footer>
    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="自由記述で質問もOK！なんでも書いてね" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" aria-label="送信" disabled>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

/* ══ サーバ不要モード（GitHub Pages用） ══════════════════════
   ビルド時に prompts.js（window.PROMPTS）が同梱されている場合、
   ローカルサーバを経由せず、ブラウザから直接 Anthropic API を呼ぶ。
   APIキーは右上の歯車から入力（このブラウザのみに保存）。       */
const DIRECT = typeof window.PROMPTS === 'object' && window.PROMPTS !== null;
/* 中継サーバ（Cloudflare Worker）が設定されていれば、APIキーの代わりに
   合言葉（x-access-code）を送る。キーは中継サーバだけが持つ。 */
const RELAY = (typeof window.RELAY_URL === 'string' && window.RELAY_URL) || '';

function buildSystemDirect(){
  const p = window.PROMPTS;
  const parts = [p.common, p.knowledge];
  if (S.who === 'kaicho') {
    parts.push(p.kaicho, '\n## 今回の指定\n\n必ず西牧会長として答えてください。1行目は `[KAICHO]` です。');
  } else if (S.who === 'shacho') {
    parts.push(p.shacho, '\n## 今回の指定\n\n必ず諸沢社長として答えてください。1行目は `[SHACHO]` です。');
  } else {
    parts.push(p.kaicho, p.shacho, [
      '\n## 今回の指定（どちらが答えるかを自分で選ぶ）', '',
      '相談内容を読んで、より適した方が答えてください。', '',
      '- 将来・お金・目標・キャリア・勉強・第一印象・信用 → 西牧会長',
      '- 今日の仕事のつらさ・人間関係・自信のなさ・落ち込み → 諸沢社長',
      '- 相手が弱っている、傷ついていると感じたら → 諸沢社長', '',
      '迷ったら諸沢社長を選んでください。数字で突きつけるのは、余裕がある相手にだけです。',
    ].join('\n'));
  }
  if (S.mode === 'praise') parts.push(p.praise);
  return parts.join('\n\n---\n\n');
}

function directRequest(){
  const headers = { 'content-type':'application/json' };
  if (RELAY) {
    headers['x-access-code'] = S.key;   // 合言葉。キーは中継サーバが持つ
  } else {
    headers['x-api-key'] = S.key;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  return fetch(RELAY || 'https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers,
    body: JSON.stringify({
      model:'claude-opus-5',
      max_tokens:4000,
      stream:true,
      output_config:{ effort:'low' },
      system:[{ type:'text', text:buildSystemDirect(), cache_control:{ type:'ephemeral' } }],
      messages:S.history.slice(-20).map(m => ({
        role: m.role === 'assistant' ? 'assistant' : 'user',
        content: String(m.content || '').slice(0, 4000),
      })),
    }),
  });
}

/* ══ 描画 ══════════════════════════════════════════════════ */
function renderChips(){
  const pool = CHIPS[S.mode] || [];
  const picked = pool.slice();
  for (let i = picked.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

  $('#chips').querySelectorAll('.chip:not(.reroll)').forEach(b =>
    b.addEventListener('click', () => { input.value = b.textContent; resize(); input.focus(); }));
  $('#chips').querySelector('.reroll').addEventListener('click', renderChips);

function renderIntro(){

  $('#intro-title').textContent = c.title;

function addMessage(kind, text){
  intro.style.display = 'none';
  const el = document.createElement('div');
  el.className = `msg ${kind}`;
  el.innerHTML = kind === 'me'
    ? '<div class="body"><div class="bubble"></div></div>'
    : `<img class="av" src="${AVATAR[kind]}" alt=""><div class="body"><div class="who">${NAME[kind]}</div><div class="bubble"></div></div>`;
  el.querySelector('.bubble').textContent = text;
  log.appendChild(el);
  scroll();
  return el.querySelector('.bubble');
}

function addRaw(html){
  intro.style.display = 'none';
  const el = document.createElement('div');
  el.innerHTML = html;
  log.appendChild(el.firstElementChild);
  scroll();
}

function scroll(instant){ requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: instant ? 'auto' : 'smooth' })); }

/* 会長は改行を多用する文体なので、空行が続きすぎたら1行にまとめる */
function tidy(t){ return t.replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n'); }

/* ══ タイプライター表示 ═══════════════════════════════════════
   通信は塊で届くのでそのまま出すとカクつく。届いた文字をいったん
   貯めて、一定のリズムで少しずつ表示する。遅れが溜まったときだけ
   歩幅を広げて追いつく。                                        */
function typewriter(bubble){
  let target = '', shown = 0, done = false, resolveDone = null;
  let stopped = false, last = performance.now();

  function complete(){
    if (stopped) return;
    stopped = true;
    clearInterval(hiddenTimer);
    bubble.textContent = target;
    scroll();
    if (resolveDone) resolveDone();
  }

  // 描画フレームに同期して、小数単位で文字数を進める（毎フレーム1〜2文字＝なめらか）
  function frame(now){
    if (stopped) return;
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (shown < target.length) {
      const behind = target.length - shown;
      // 遅れの量に比例して速度を連続的に変える（段差を作らない）
      const rate = Math.max(30, Math.min(600, behind * (done ? 6 : 2)));
      shown = Math.min(target.length, shown + rate * dt);
      bubble.textContent = target.slice(0, Math.floor(shown));
      scroll(true);
    } else if (done) {
      complete();
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 裏のタブでは描画フレームが止まるため、こちらで一気に表示して締める
  const hiddenTimer = setInterval(() => {
    if (document.hidden && target) {
      shown = target.length;
      bubble.textContent = target;
      if (done) complete();
    }
  }, 400);

  return {
    update(t){ target = t; },
    finish(t){ target = t; done = true; return new Promise(r => { resolveDone = r; if (stopped) r(); }); },
    cancel(){ stopped = true; clearInterval(hiddenTimer); },
  };
}

function resize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  sendBtn.disabled = S.busy || !input.value.trim();
}

/* ══ 送信 ══════════════════════════════════════════════════ */
async function send(text){
  if (S.busy) return;
  // 合言葉が未入力なら、画面には何も出さずにロック画面へ（通過後に自動送信）
  if (DIRECT && RELAY && !S.key) {
    window.__pendingText = text;
    input.value = ''; resize();
    if (window.showGate) window.showGate();
    return;
  }
  addMessage('me', text);
  S.history.push({ role:'user', content:text });
  input.value = ''; resize();

  if (HANDOFF.some(w => text.includes(w))) {
    addRaw(CONTACTS);
    S.history.pop();
    return;
  }

  S.busy = true; sendBtn.disabled = true;

  const guess = S.who === 'kaicho' ? 'kaicho' : 'shacho';
  const bubble = addMessage(guess, '');
  bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  const wrap = bubble.closest('.msg');
  let tw = null;

  try {
    let res;
    if (DIRECT) {
      if (!S.key) {
        wrap.remove(); S.history.pop();
        addRaw(errorCard(400, { error:'no_api_key' }));
        return;
      }
      res = await directRequest();
    } else {
      const headers = { 'content-type':'application/json' };
      if (S.key) headers['x-user-api-key'] = S.key;
      res = await fetch('/api/chat', {
        method:'POST', headers,
        body: JSON.stringify({ messages:S.history, speaker:S.who, mode:S.mode }),
      });
    }

    if (!res.ok) {
      const info = await res.json().catch(() => ({}));
      wrap.remove();
      if (RELAY && info.error === 'bad_code') {
        // 合言葉が変更された等。保存を消して、もう一度ロック画面へ（質問は通過後に自動再送）
        S.key = ''; localStorage.removeItem('pocket_key');
        const meMsg = [...log.querySelectorAll('.msg.me')].pop();
        if (meMsg) meMsg.remove();
        window.__pendingText = text;
        if (window.showGate) window.showGate();
      } else {
        addRaw(errorCard(res.status, info));
      }
      S.history.pop();
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '', tagged = false;

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (ev.type !== 'content_block_delta' || ev.delta?.type !== 'text_delta') continue;

        full += ev.delta.text;

        if (!tagged) {
          const m = full.match(/^\s*\[(KAICHO|SHACHO)\]\s*\n?/);
          if (m) {
            const who = m[1] === 'KAICHO' ? 'kaicho' : 'shacho';
            wrap.className = `msg ${who}`;
            wrap.querySelector('.who').textContent = NAME[who];
            wrap.querySelector('.av').src = AVATAR[who];
            full = full.slice(m[0].length);
            tagged = true;
          } else if (full.length > 24) {
            tagged = true;
          }
        }
        if (tagged) {
          if (!tw) { bubble.textContent = ''; tw = typewriter(bubble); }
          tw.update(tidy(full));
        }
      }
    }

    const finalText = tidy(full).trim();
    if (tw) await tw.finish(finalText);
    else bubble.textContent = finalText;
    S.history.push({ role:'assistant', content: finalText });

  } catch (err) {
    if (tw) tw.cancel();
    wrap.remove();
    addRaw(`<div class="error">通信に失敗しました。サーバが起動しているか確認してください。<br><code>${String(err)}</code></div>`);
    S.history.pop();
  } finally {
    S.busy = false; resize();
  }
}

function errorCard(status, info){
  if (info.error === 'no_api_key')
    return RELAY
      ? '<div class="error">合言葉が設定されていません。右上の歯車から入力してください。</div>'
      : '<div class="error">APIキーが設定されていません。右上の歯車から入力してください。</div>';
  if (info.error === 'bad_code')
    return '<div class="error">合言葉が違うようです。右上の歯車から入れ直してください。</div>';
  if (info.error === 'no_api_key_on_server')
    return '<div class="error">サーバ側のAPIキーが未設定です。管理者に連絡してください。</div>';
  if (status === 401)
    return '<div class="error">APIキーが正しくないようです。右上の歯車から入れ直してください。</div>';
  if (status === 429)
    return '<div class="error">今アクセスが混み合っています。少し待ってからもう一度送ってください。</div>';
  return `<div class="error">応答を受け取れませんでした（${status}）。<br><code>${(info.detail || info.error || '').toString().slice(0,200)}</code></div>`;
}

/* ══ 会長の言葉（勉強会・セミナー・20年のブログから要約） ═══════ */
const KOTOBA = [
  { cat:'素直と学び', items:[
    { t:'素直最強', s:'ブログ', b:'「わからないことを聞くのは恥ずかしい」と思っている人は多い。でも恥ずかしいのは一瞬で、聞かないまま間違え続ける方がずっと恥ずかしい。これが会長の口ぐせ「素直最強」。自分がバカだとわかっているバカは、人に聞くから成長が速い。わかっていないバカは、人の話を聞かないから成長が遅い。頭の良し悪しではなく、素直さの差が数年後に大きな差になる。会議で「累計ってどういう意味ですか？」と平気で聞ける諸沢社長を、会長が高く評価しているのもこのためだ。' },
    { t:'弟子入りのすすめ', s:'ブログ', b:'会長は学ぶことを「弟子入り」と呼ぶ。自身も多くの先輩経営者に弟子入りし、時間とお金をかけて教えを乞うてきた。大人になるほどプライドが邪魔をして弟子入りしづらくなり、教えてくれる目上の人もどんどん減っていく。だから若いうちに、どんどん弟子入りして、どんどん恥をかくべきで、それこそが若い人だけに許された特権。教わる相手は有名人である必要はなく、職場の先輩でも、近所の経営者でもいい。頭を下げて教えを乞える人から、順番に強くなっていく。' },
    { t:'真似から始める', s:'議事録', b:'「西牧にオリジナルは何もない。全部誰かの真似」と会長は言い切る。自己肯定感が低かったからこそ、生き残るために「できている人の真似をする」ことを徹底してきた。先輩に靴を叱られたときは、言い訳をせずに先輩と同じ靴を買って履いていった。ゼロから自分で考えるより、うまくいっている人のやり方をそのまま真似る方が、速くて確実。真似を積み重ねた先に、いつの間にか自分のスタイルができている。独創性は、真似の量から生まれる。' },
    { t:'賢者は歴史から学ぶ', s:'ブログ', b:'「賢者は歴史から学び、愚者は経験から学ぶ」。会長の言う「歴史」とは教科書のことではなく、身近な先人のこと。自分で全部失敗して学ぶには、人生は短すぎる。先輩の成功も失敗も、話を聞けばタダで手に入る教材になる。同じ失敗を自分でもう一度やる必要はない。だからこそ人の話を聞きに行くこと、本を読むこと、勉強会に出ることに意味がある。人の経験を自分の栄養にできる人が、結局いちばん速く、いちばん遠くまで行ける。' },
    { t:'1日13分の現実', s:'勉強会', b:'社会人の平均勉強時間は1日13分というデータがある（別の調査では6分）。半分以上は全く勉強しておらず、先進国では最低水準。つまり、社会に出た瞬間にほとんどの人が学ぶことをやめてしまう。逆に言えば、1日20分でも勉強を続けるだけで、もう平均を超えられる。会長はこれを「楽に勝てる戦い」と呼ぶ。相手が走っていないレースで、自分だけ毎日少しずつ走る。1年では小さな差でも、数年後には追いつけない差になっている。' },
    { t:'YouTubeで20分', s:'ブログ', b:'今の時代、学びにお金はほとんど要らない。YouTubeには一流の経営者や専門家の話が無料で転がっている。1日20分、通勤や休憩の時間に見るだけで、全く勉強しない人との差は開くばかり。会長はこれを「楽に勝てる戦いです」と勉強会で繰り返し語る。大事なのは教材の質より継続すること。バラエティを1本我慢して、ニュースやドキュメンタリーに置き換えるだけでも、1年後の自分の会話の中身が変わってくる。始めるのに準備も許可も要らない。' },
    { t:'勉強は社会に出てからが本番', s:'勉強会', b:'学生時代の成績で人生が決まるわけではない。ほとんどの人が社会に出ると勉強をやめてしまうからこそ、社会に出てからも学び続ける人が独り勝ちできる。会長自身、偏差値36の高校出身で学歴はない。大学時代は借金200万円を抱えて住所不定になるほどのダメ人間だった。それでも20歳から学び続けて、53歳で資産3億円を達成した。勉強会の締めに必ず「勉強は社会に出てからが本番です」と言うのは、過去の成績で自分に見切りをつけてほしくないから。スタートラインは、今からでも引き直せる。' },
  ]},
  { cat:'目標とお金', items:[
    { t:'ゴールから逆算する', s:'議事録', b:'会長は20歳のとき「50歳で3億円持って引退する」と決めた。当時そんな条件の会社は存在しなかったので、自分でそんな会社を作るしかないと起業を決意。50歳から逆算して45歳・40歳・35歳の中間目標を立てた。すると行動が全部変わった。見る番組はバラエティからニュースやドキュメンタリーへ。読む本は漫画から自己啓発本や日経新聞へ。付き合う人はチャラチャラした仲間から経営者へ。結果、53歳で社長を退き、資産3億円以上を達成した。ゴールを決めるから、今日やることが決まる。' },
    { t:'努力の総量は変わらない', s:'議事録', b:'20歳のとき、会長が人生について真剣に考えて自分で作ったモデルがある。「人生で費やす努力の総量は、人によって大差ない。その努力をどの時期に配分するかが違うだけ」。若いうちに努力を前倒しした人は、人生の後半を楽に生きられる。逆に若いうちに楽をした人は、あとから追いかける側に回る。同じしんどさなら、体力も時間もある20代に寄せた方が利回りがいい。今がんばることは損ではなく、未来の自分への仕送りだと考える。' },
    { t:'大変なのは「想定内」', s:'議事録', b:'53歳で3億円の目標を達成した会長は「大変だと感じたことは一度もない」と言う。嘘のような話だが、理由は単純で、目標達成のためには大変なのが当たり前だと、最初から「想定」していたから。人の心が折れるのは、大変さそのものではなく「こんなはずじゃなかった」という想定外に出会ったとき。だから挑戦する前に大きく見積もって、ガッツリ想定しておく。そうすれば途中の困難は驚きではなく、ただの確認作業になる。想定内の苦労は、通過点でしかない。' },
    { t:'公言する', s:'勉強会', b:'夢や希望は胸に秘めていても叶わない。会長がよく話すのが、アイドルの大ファンだったアルバイトの話。彼がファンだと公言していたから、会長は本人に会う機会を得たとき、真っ先に彼に声をかけた。後日、別のアルバイトに「なぜ自分も誘ってくれなかったのか」と言われた会長の答えは「君がファンだと知らなかったからだ」。人生は他者からの選択で決まる。誰かがチャンスを配るとき、頭に浮かぶのは公言していた人だけ。夢も目標も、言った者勝ち。' },
    { t:'崖っぷちを自分で作る', s:'ブログ', b:'会長はブログ「ココイチで独立した社長の生活」を20年以上、ほぼ毎日書き続けている。目的は日記ではなく、公言したことを守らざるを得ない状況、つまり「崖っぷち」を自分で作ること。人は弱いから、逃げ道があれば逃げる。だから先に人に言ってしまい、自分で逃げ道を塞ぐ。ブログで宣言して、読者に見られていると思えば、サボれなくなる。意志の強さに頼るのではなく、続けざるを得ない仕組みを自分で設計する。それが20年続いた本当の理由。' },
    { t:'複利は人類最高の発明', s:'勉強会', b:'アインシュタインが「人類最高の発明」と呼んだのが複利。月5万円を30年間ただ貯金すると1800万円。同じ金額を年利5%の複利で運用すると4161万円になり、差は2300万円を超える。増えた利息がさらに利息を生む、雪だるまの構造だから。大事なのは金額より時間で、早く始めるほど雪だるまは大きくなる。NISA口座はすでに2826万口座。知っている人はもう始めている。「テクノロジーと投資は早いもん勝ち」を象徴する数字。' },
    { t:'基本給2万円の重み', s:'勉強会', b:'就職や転職のとき「基本給が2万円くらい違っても大差ない」と思ったら大間違い。基本給が月2万円違うと、賞与や昇給への影響も含めて生涯賃金では約1000万円、4万円なら約2000万円の差になる。生涯賃金そのものにも、大卒2億6280万円・高卒2億1100万円・契約社員1億4000万円という大きな差がある。目先の月給ではなく「生涯でいくら違うか」で考えるのが会長流。選択の重みを数字で知っていれば、今日の努力の意味が変わってくる。' },
    { t:'老後は計算できる', s:'勉強会', b:'老後の不安は、漠然と抱えるものではなく計算するもの。式はシンプルで「（想定寿命−引退年齢）×12ヶ月×1ヶ月の希望生活費」。例えば90歳まで生きるとして60歳で引退し、月25万円で暮らすなら、30年×12ヶ月×25万円で9000万円が必要になる。年金は夫婦で月20万円程度だから、足りない分がはっきり見えてくる。数字にすれば、怖さは課題に変わり、課題には対策が立てられる。不安の正体は、実は「計算していないこと」そのもの。' },
    { t:'4種類の人間', s:'勉強会', b:'社会には「労働者」「使用者」「投資家」「資産家」の4種類の人間がいる。労働者は自分の時間を売ってお金を得る。使用者は人を雇って事業を営む。投資家はお金に働いてもらう。資産家は資産が生む収入で生きる。どれが偉いという話ではなく、自分が今どこにいて、これからどこを目指すのかを知っていることが大事。目指す場所によって、今日やるべき勉強も、付き合うべき人も変わってくる。地図を持っている人と持っていない人では、同じ努力でも着く場所が違う。' },
    { t:'最大のリスクは長生き', s:'勉強会', b:'意外に聞こえるが、お金の話で最大のリスクは「予定した年齢で死ねなかったら」だと会長は言う。平均寿命は男性81歳・女性87歳、もはや人生100年時代。90歳、100歳まで生きたときにお金が尽きるのが長寿リスク。さらに親一人あたりの介護費用は平均540万円で、夫婦双方の親4人なら2000万円を超える可能性もある。長生きは本来喜ばしいこと。それを不安にしないために、若いうちから複利と時間を味方につけて、計算して備えておく。' },
    { t:'借りる場所で141万円変わる', s:'勉強会', b:'銀行の金利はおよそ2%、消費者金融は18%。同じ300万円を5年で返す場合、返済総額の差は141万円以上になる。どこで借りるかを知っているかどうか、それだけで軽自動車1台分のお金が消えるかどうかが決まる。お金の知識は、稼ぐためだけでなく、失わないためにも必要になる。学校では誰も教えてくれないからこそ、自分で学んだ人と学ばなかった人の差は静かに、しかし確実に開いていく。「知らないことは、それだけで高くつく」を象徴する数字。' },
    { t:'不労所得も逆算で作る', s:'議事録', b:'会長は東京都内のマンション5部屋を、自己資金ゼロのフルローンで購入した。63歳でローンを完済すれば、家賃収入が月75万円の不労所得になる計画。これも「50歳で3億円」と同じ逆算思考で、老後の安心は祈って待つものではなく、計算して作るもの。30年間、銀行との約束を一度も破らなかった信用があったからこそ、フルローンという手段が使えた。信用・知識・時間。この3つの資産を組み合わせれば、給料以外の収入源は誰にでも設計できる。' },
  ]},
  { cat:'仕事の姿勢', items:[
    { t:'逃げ言葉を使わない', s:'ブログ', b:'会長が指摘する逃げ言葉は4つ。「出来る限り」「頑張り」「たい」「思います」。「出来る限り頑張りたいと思います」という一文には、逃げ言葉が4つ全部入っている。どれも「解釈」の余地があるから、できなかったときの言い訳が立つようにできている。会長はこの言葉を使わないし、使う相手にはその場で指摘する。代わりに「いつまでに、何を、どうする」と言い切る。言い切るから逃げられなくなり、逃げられないから実行する。言葉を変えるだけで、行動の質が変わる。' },
    { t:'人間はウッカリした生き物', s:'ブログ', b:'「人間はシッカリした生き物ではない、ウッカリした生き物である」が会長の持論。人は必ずミスをするという前提に立てば、やるべきことが変わってくる。「大丈夫だろう」を撲滅して、「絶対に間違いない」と言えるまで確認する。二度見る、指差す、人に見てもらう。ウッカリした人を責めるのではなく、ウッカリしても事故にならない仕組みを作っておく。自分を過信しない人ほど、結果的にいちばんミスが少ない。30年の信用は、この確認の積み重ねでできている。' },
    { t:'キャパは自分で決める', s:'ブログ', b:'「もうキャパオーバーです」と言いたくなるとき、そのキャパの上限を決めているのは、実は自分自身。「キャパオーバーかどうかは自分で決める。自分ができる範囲は、自分で増やすしかない」と会長は言う。少し多めの仕事を引き受けて、やり切る。それを繰り返すたびに、器は少しずつ広がっていく。会長は56歳になっても「西牧、まだキャパが広がっている気がしますｗ」とブログに書く。器の大きさは生まれつきではなく、挑戦した回数で決まる。' },
    { t:'返信の速さは信用', s:'ブログ', b:'会長がWBCのチケットを手に入れたとき、誘ったのは息子ではなく友人だった。理由は単純で、息子はLINEの返信が遅く、友人は即返信だったから。毎日欠かさず感想のLINEを送ってくる社員は、返事が早いというだけで信用され、評価が上がっていく。返信の速さは能力ではなく姿勢の問題。速く返す人には「この人に渡せばすぐ動く」という信用がつき、次のチャンスが自然と回ってくる。チャンスは、返信の早い順に配られている。' },
    { t:'ミスしたら素直に謝る', s:'ブログ', b:'会長はオンライン会議に7分遅刻したとき、翌朝4時半に起きて「ペナルティRUN」を走り、その顛末を包み隠さずブログに書いた。ミスを隠したり言い訳したりせず、素直に認めて謝り、自分でけじめをつける。偉くなるほど謝れなくなる人が多い中で、30年会社を率いてきた人がいちばん素直に謝る。だから部下も安心してミスを報告できるし、会社として早く手が打てる。ミスそのものより、ミスの後の振る舞いに人柄が出る。カッコつけないことが、いちばんカッコいい。' },
    { t:'毎朝の積み重ね', s:'ブログ', b:'会長は毎朝ジョギングをして、全社員の日報に目を通してから出社する。特別な才能の話ではなく、決めたことを毎日やるという話。460名の日報を毎日読んでいるから、現場の小さな変化に誰よりも早く気づける。ブログも20年以上ほぼ毎日続けている。一つ一つは誰にでもできる小さな習慣でも、10年続けば誰にも真似できない資産になる。「何をやるか」より「やめないこと」。毎朝の積み重ねが、そのまま信用と実力の積み重ねになっている。' },
    { t:'顔を向けて「ありがとう」', s:'議事録', b:'会長は26歳で独立したとき、客一人ひとりに必ず顔を向けて「ありがとうございました」と言うことを徹底した。皿を洗いながら、背中越しに言う「ありがとう」は、言っていないのと同じ。手を止めて、顔を向けて、目を見て言う。それだけで客は「自分に言ってくれた」とわかり、その積み重ねが再来店につながった。1店舗が2店舗になり、やがて30店舗・従業員460名の会社になった。すべての原点は、挨拶の向きひとつだったと会長は振り返る。' },
    { t:'現場を回り続ける', s:'議事録', b:'スカイスクレイパーには「臨店」という文化がある。会長は週5日店舗を回り、週末だけ群馬の自宅に戻る生活を続けてきた。売上の数字は本社にいても見られるが、店の空気、スタッフの表情、ポットの傾きといった生の情報は現場でしか手に入らない。この文化は諸沢社長にも引き継がれていて、いちばん遠い秋田の店舗にも月に一度は入り、現場にも立つ。トップが現場を歩き続けるから、現場の声が経営に直結する。答えは会議室ではなく、いつも現場にある。' },
  ]},
  { cat:'幸福度を高める4つの秘訣', items:[
    { t:'① 相手のために急ぐ', s:'勉強会', b:'飲食店に来る客は「お腹が空いている」から来る。空腹の人は気が短い。だから急ぐこと自体が愛情表現になる。注文から15秒でカレーを出すことも実際に可能で、その速さは「自分のために急いでくれた」という感謝になり、再来店につながっていく。逆に相手を待たせることは、その人の貴重な時間を奪う失礼な行為。これは接客に限った話ではなく、返信を急ぐ、報告を急ぐ、頼まれごとにすぐ着手する、全部同じ。目の前の人のためにすぐ動くことが、幸福度を高める第一の秘訣。' },
    { t:'② 思いやりは「先回り」', s:'勉強会', b:'思いやりとは「相手がしてほしいことをすること」。そして本当の思いやりは、問題が起きてから対処するのではなく、起こる前に気づいて動くこと。年配の女性客の顔色の悪さに気づいて、倒れる前に声をかける。ポットの水がなくなる前に交換する。辛いカレーを食べている人に、頼まれる前に「辛いですよね」と水を持っていく。先回りは、相手をよく見ていないと絶対にできない。だから思いやりの正体は、優しさという気分ではなく、観察と行動のセットなのだ。' },
    { t:'③ 感性を磨く', s:'勉強会', b:'AIがマニュアル通りの仕事をどんどん代替していく時代に、人間に残るのは、マニュアルを超えた瞬間的な状況判断、つまり「感性」。子供が塗り絵をしやすいようにポットの位置を変えた新人のような、規則のどこにも書いていない気づきのこと。感性を磨く方法は一つで、多くの人に会い、多様な意見を聞くこと。同じ仲間とだけ付き合っていると感性は固まっていく。店の外に出て、年齢も職業も違う人と話した経験が、そのまま仕事の武器になる。' },
    { t:'④ 感謝は態度で示す', s:'勉強会', b:'感謝は口先ではなく、本気の態度で示すもの。自分の財布の中身をこの店に使ってくれる客に対して、皿を洗いながら「ありがとうございました」と言うのは失礼で、面倒でも手を止めて、顔を向けて言う。それが態度で示すということ。給料をもらったら親に、助けてもらったら先輩に、言葉だけでなく行動でも返す。感謝が態度に出ている人は、周りから「また助けたい」と思われる。感謝の示し方ひとつで、これから受け取れるチャンスの量が変わってくる。' },
  ]},
  { cat:'人との関わり', items:[
    { t:'人生は他者からの選択で決まる', s:'勉強会', b:'採用されるかどうかを決めるのは面接官。恋人になれるかどうかを決めるのは相手。仕事を任せるかどうかを決めるのは上司や客。つまり人生の節目は、ほとんどが他者からの選択で決まっている。だからこそ、選ばれる側である自分がどう見えているかが決定的に重要になる。就職活動で内定をいくつも取る学生と全く取れない学生の差は、学歴や成績ではなく第一印象だった、というのが多くの学生を見てきた会長の実感。選ばれる準備は、相手に会う前から始まっている。' },
    { t:'挨拶の3要素', s:'勉強会', b:'良い挨拶の条件は3つ。①相手の目を見ること、②表情を柔らかくすること、③体を揺らさず、姿勢を正すこと。注意したいのは、無表情のまま目だけ見ると、逆に圧迫感や不快感を与えてしまうこと。目が合ったときに表情を和らげるのは「あなたと戦う意思はありません」という、DNAに刻まれた本能への合図だから。この3つは才能ではなく技術で、練習すれば誰でも今日からできる。たった数秒の挨拶が、その後の関係すべての入口になる。' },
    { t:'一生に1万枚の「はじめまして」', s:'勉強会', b:'営業職なら、一生に配る名刺は5千枚から1万枚と言われる。それだけの回数「はじめまして」の場面があるということ。一回一回の挨拶の質が、そのまま人生の質を左右する。これは営業職に限った話ではない。専業主婦になる人にも、パートナーの家族への挨拶、ご近所付き合い、子供の学校行事と、第一印象の場面は一生続いていく。だからこそ挨拶と第一印象は、職業に関係なく全員が磨く価値のある技術。「第一印象、磨いて参りましょう」が勉強会の定番の締めの言葉。' },
    { t:'観察がすべての入口', s:'勉強会', b:'ポットの傾き具合を見て、水がなくなる前に交換する。辛いカレーを食べている客の様子を見て、頼まれる前に水を出す。思いやりも、気配りも、先回りも、すべては「観察」から始まる。見ていない人は、気づけない。気づけない人は、動けない。だから会長は「観察力と思いやりのある人はモテる」と言う。恋愛でも仕事でも、自分をよく見てくれている人は信頼されるからだ。観察は特別な能力ではなく、目の前の相手にどれだけ興味を持つかという姿勢の問題。' },
    { t:'信用は30年の複利', s:'議事録', b:'27歳のとき、600万円のランドクルーザーを買うために銀行に融資を申し込んだが、信用がなく門前払いされた。2週間粘り強く交渉して、ようやく金利2.8%で借りられた。それから30年、借入が最大7億円あった時期も含めて、返済を一度も遅らせなかった。その結果、最近7000万円が必要になったときは、支店長への電話一本、わずか2日、金利0.95%、サインもハンコもなしで振り込まれた。信用はお金と同じで複利で増える。ただし築くのに30年、失うのは一瞬。' },
    { t:'マニュアルを超える', s:'勉強会', b:'ある新人が、子供が塗り絵をしやすいようにと、マニュアルで決められたポットの置き位置を自分の判断で変えた。会長はそれを叱らず「イケてんじゃん」と褒めた。マニュアルは過去の正解をまとめた道具であって、目の前の状況の正解とは限らない。ルールを守ることと、相手のために自分の頭で考えることは、ちゃんと両立する。大事なのは「何のためのルールか」という目的を理解していること。目的がわかっていれば、ルールを破るのではなく、超えることができる。' },
    { t:'規則より本質を見る', s:'勉強会', b:'約33年前、交通事故で血まみれの子供を抱えた母親が店に電話を借りに来たとき、店員がマニュアルを理由に断った、という話がある。会長ならどうするか。電話を貸すのではなく、自ら119番に電話する。その場の状況をいちばん正確に伝えられるのは、目の前で見ている自分自身だから。規則を守ったのに結果として人を助けられないなら、それは仕事の本質を見失っている。ルールは目的を達成するための道具であって、考えることをやめる言い訳にしてはいけない。' },
    { t:'得意なことは人に聞く', s:'勉強会', b:'就活のエントリーシートに書く「得意なこと」が見つからない、と質問した大学生がいた。会長の答えは「周りの人に聞いてみること」。自分の得意は、自分ではなかなか見えない。自分にとっての当たり前が、他人から見ると特別だったりするから、友達や家族に「私の得意なことって何だと思う？」と聞くのがいちばん早い。そして会長はこう付け加えた。大勢の参加者の前で、最初に手を挙げて質問できたこと自体が、もう立派な「得意なこと」ですよ、と。' },
    { t:'挨拶は準備で決まる', s:'勉強会', b:'コミュニケーションが苦手だと相談してきた社員への会長のアドバイスは、才能ではなく「準備」だった。第一歩は、自分から先に元気に挨拶すること。そして、誰にでも通用する質問をあらかじめ20個用意しておくこと。「最近いちばん楽しかったことは？」のような質問なら、初対面の誰が相手でも会話が始められる。話し上手になる必要はなく、聞く準備をしておくだけでいい。苦手なものほど、その場のアドリブで戦わず、事前の準備で勝つ。' },
  ]},
  { cat:'生き方', items:[
    { t:'意志ある者にはチャンスを', s:'ブログ', b:'19歳の次期店長から「勇退されるまで僕を鍛え直して下さい」と言われたとき、会長は即答で引き受けた。「意志ある者にはチャンスを」が信条だから。本気で来る人には、本気で返す。逆に言えば、チャンスがほしいなら、本気だと伝わる形で自分から取りに行くこと。黙って待っている人にチャンスを配ってくれる大人は、残念ながらいない。年齢も経験も関係ない。意志を見せた瞬間から、周りの扱いが変わり、教えてもらえる中身が変わる。手を挙げた人だけが、鍛えてもらえる。' },
    { t:'0.01%の一流になる', s:'勉強会', b:'勉強会の締めの定番が「0.01%の一流になって下さい」。一流と聞くと才能の話に聞こえるが、会長の言う一流は違う。ほとんどの人が社会に出ると勉強をやめ、ほとんどの人が挨拶を磨かず、ほとんどの人が返信を後回しにする。だから、当たり前のことを続けるだけで、上位0.01%に近づいていける。勉強・挨拶・返信・感謝。どれも特別な才能の要らない項目で一流になれば、その掛け算で、誰にも真似できない人材になっていく。' },
    { t:'親に感謝を伝える', s:'勉強会', b:'子供一人を育てるのにかかるお金は平均4304万円。この数字を勉強会で聞いたある大学生は「それだけかけてもらった親に、一度も感謝を伝えていない自分は幸せになれない」と語った。半年後、20歳の誕生日に父親に電話をかけて「生んでくれてありがとう」と伝え、長年のわだかまりが解けたと、泣きながら会長に報告してきた。「今、幸せです」と。感謝は、思っているだけでは一生伝わらない。伝えたその瞬間から、相手との関係も、自分自身も変わり始める。' },
    { t:'幸福度は更新できる', s:'議事録', b:'会長は56歳の今も「毎年、幸福度を更新し続けている」と言う。普通は歳を取るほど、体力も選択肢も減っていくように感じるものだが、学び続け、挑戦し続け、感謝を伝え続ける人は、人生の後半からでも毎年幸せになっていける。幸福は若さや運で決まるのではなく、日々の習慣の合計だから。今日の積み重ねが1年後の幸福度を決める。そう考えれば、年齢を理由に何かを諦める必要は、どこにもない。何歳からでも、今年を人生でいちばん幸せな年にできる。' },
    { t:'会社のためではなく、自分のため', s:'議事録', b:'会長は「会社のために頑張れ」とは絶対に言わない。人は自分のためにしか、本気で頑張れないと知っているから。勉強会も臨店での声かけも、すべて「それが君自身のどんな得になるか」に翻訳して伝えられる。挨拶を磨くのは会社の評判のためではなく、君が一生使える武器になるから。勉強するのは会社の業績のためではなく、君の生涯賃金が変わるから。だから従業員は、やらされ仕事ではなく自分の人生のために動ける。この哲学が、外部コンサルも人事評価制度も一切使わない460名の会社を支えている。' },
    { t:'学歴より人間性', s:'勉強会', b:'「これからは学歴よりも人間性が評価される時代が来る」と会長は言う。AIが知識やスキルの差をどんどん埋めていくほど、最後に残るのは「この人と一緒に働きたいか」という人間性の勝負になる。自分をチェックする質問は一つだけ。「あなたが経営者なら、今のあなたを雇いたいか？」。即答で「雇いたい」と言えないなら、何が足りないのかを考えて、そこから磨けばいい。学歴は今から変えられないが、人間性は今日から磨ける。偏差値36の高校から会社を築いた会長自身が、その生きた証明。' },
    { t:'IQ・EQの次はLQ', s:'勉強会', b:'頭の良さを示すIQ、心の知能指数と呼ばれるEQに続いて、これから重要になるのがLQ。リーダーシップ指数（Leadership Quotient）であり、同時に愛の指数（Love Quotient）でもある。AIがマニュアル通りの仕事を代替していく時代に、人を思いやり、人を動かし、人から愛される力だけは代替されない。カレーを15秒で出す速さも、倒れそうな客に先に気づく観察力も、根っこにあるのは相手への愛。技術や知識より先に、人を思う力を磨いておく。それが一生モノの土台になる。' },
    { t:'早いもん勝ち', s:'勉強会', b:'「テクノロジーと投資は早いもん勝ち」と会長は言い切る。複利は時間が長いほど大きく増えるから、投資は1年でも早く始めた人が勝つ。テクノロジーも同じで、新しい道具を早く使い始めた人が、様子見している人との差をどんどん広げていく。NISA口座はすでに2826万口座。AIも、使う人と使わない人の差が毎日開いている。「まだよくわからないから」と待っている時間が、実はいちばん高くつく。わからないなら、小さく始めて、走りながら学べばいい。' },
    { t:'サービス精神に理由はいらない', s:'勉強会', b:'余命半年の少年が、ディズニーワールドでキャラクターのサインを集めたサイン帳を失くしてしまった。キャストたちは総出で探し、見つからないとわかると、新しいサイン帳に同じキャラクターたちのサインを再現して、家族のもとへ送った。マニュアルにも、損得勘定にもない行動。ただ少年をもう一度笑顔にしたい、というサービス精神だけで、人はここまで動ける。会長がこの話をするのは、仕事の報酬はお金だけではないと伝えたいから。誰かを心から笑顔にした記憶は、一生自分を支えてくれる。' },
    { t:'学びの場は開くほど強くなる', s:'議事録', b:'スカイスクレイパーの勉強会は、会長が一人で3時間話す会を各エリアで年2回、年間およそ10本。アルバイトやパートも含めて参加中の給与がきちんと支払われ、交通費も会場費もすべて会社持ち。さらに従業員の家族や恋人、取引先である銀行の支店長まで、無料で参加できる。学びを社内に閉じ込めず、関わる人全員に開く。家族が会社の考え方を知れば応援してくれるし、銀行が理念を知れば信用が深まる。学びの場を開くことが、そのまま会社の強さになっている。' },
  ]},
];

function renderKotoba(){
  let k = document.getElementById('kotoba');
  if (!k) {
    k = document.createElement('div');
    k.id = 'kotoba'; k.className = 'kotoba';
    log.appendChild(k);
  }
  const total = KOTOBA.reduce((n, s) => n + s.items.length, 0);
  k.innerHTML =
    `<div class="khead"><h1>西牧会長の言葉</h1><p>勉強会・セミナー・20年のブログから ${total} の教え</p></div>` +
    KOTOBA.map(sec =>
      `<section><h2>${sec.cat}</h2>` +
      sec.items.map(it =>
        `<details class="kcard"><summary>${it.t}</summary><p>${it.b}</p><span class="ksrc">${it.s}</span></details>`
      ).join('') +
      '</section>'
    ).join('');
}

/* ══ 操作 ══════════════════════════════════════════════════ */
function goHome(){
  if (S.busy) return;              // 返信の受信中は戻れない（送信が壊れるため）
  S.mode = 'chat';
  document.querySelectorAll('.mode').forEach(x => x.setAttribute('aria-selected', String(x.dataset.mode === 'chat')));
  S.history = [];
  log.querySelectorAll('.msg, .handoff, .error').forEach(n => n.remove());
  const k = document.getElementById('kotoba'); if (k) k.remove();
  $('#form').style.display = '';
  intro.style.display = '';
  renderIntro();
  window.scrollTo({ top: 0 });
  document.querySelectorAll('video.idle').forEach(v => v.play().catch(() => {}));
}
$('#btn-home').addEventListener('click', goHome);
$('#btn-home2').addEventListener('click', goHome);

document.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => {
  S.who = b.dataset.who;
  document.querySelectorAll('.pick').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));

document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  S.mode = b.dataset.mode;
  document.querySelectorAll('.mode').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  S.history = [];
  log.querySelectorAll('.msg, .handoff, .error').forEach(n => n.remove());
  const k = document.getElementById('kotoba'); if (k) k.remove();
  if (S.mode === 'kotoba') {
    intro.style.display = 'none';
    $('#form').style.display = 'none';
    renderKotoba();
    window.scrollTo({ top: 0 });
  } else {
    $('#form').style.display = '';
    intro.style.display = '';
    renderIntro();
  }
}));

$('#form').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (t) send(t);
});

input.addEventListener('input', resize);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#form').requestSubmit(); }
});

const dlg = $('#dlg');
if (DIRECT && RELAY) {
  // 中継サーバ版: 合言葉は初回のロック画面だけで入れる。設定（歯車）は出さない
  $('#btn-settings').style.display = 'none';
  const gate = $('#gate');
  const showGate = () => {
    gate.hidden = false;
    $('#gate-err').hidden = true;
    setTimeout(() => $('#gate-code').focus(), 60);
  };
  window.showGate = showGate;
  if (!S.key) showGate();

  $('#gate-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = $('#gate-code').value.trim();
    if (!code) return;
    const btn = $('#gate-go');
    btn.disabled = true; btn.textContent = '確認中…';
    try {
      const r = await fetch(RELAY + '/check', { method:'POST', headers:{ 'x-access-code': code } });
      if (r.ok) {
        S.key = code;
        localStorage.setItem('pocket_key', code);  // この端末に保存。次回からは聞かれない
        gate.hidden = true;
        // 合言葉画面が出る前に送ろうとしていた質問があれば、自動で送り直す
        const pending = window.__pendingText;
        window.__pendingText = null;
        if (pending) send(pending);
      } else {
        $('#gate-err').textContent = '合言葉が違うようです。もう一度確かめてください。';
        $('#gate-err').hidden = false;
      }
    } catch {
      $('#gate-err').textContent = '通信できませんでした。電波の良いところでもう一度試してください。';
      $('#gate-err').hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = 'はじめる';
    }
  });
}
$('#btn-settings').addEventListener('click', () => { $('#key').value = S.key; dlg.showModal(); checkHealth(); });
$('#dlg-close').addEventListener('click', () => dlg.close());
$('#dlg-save').addEventListener('click', () => {
  S.key = $('#key').value.trim();
  if (S.key) localStorage.setItem('pocket_key', S.key); else localStorage.removeItem('pocket_key');
  dlg.close();
});

async function checkHealth(){
  const dot = $('#dot'), txt = $('#status-text');
  if (DIRECT) {
    const ready = Boolean(S.key);
    dot.className = 'dot ' + (ready ? 'ok' : 'ng');
    txt.textContent = RELAY
      ? (ready ? '接続OK' : '合言葉が未設定')
      : (ready ? '接続OK — claude-opus-5（このブラウザのキー）' : 'APIキー未設定');
    return;
  }
  try {
    const h = await (await fetch('/healthz')).json();
    const ready = h.server_key || Boolean(S.key);
    dot.className = 'dot ' + (ready ? 'ok' : 'ng');
    txt.textContent = ready
      ? `接続OK — ${h.model}（${h.server_key ? 'サーバのキー' : 'このブラウザのキー'}）`
      : `${h.model} — APIキー未設定`;
  } catch {
    dot.className = 'dot ng';
    txt.textContent = 'サーバに接続できません';
  }
}

/* 「視差効果を減らす」設定の人には動かさない（最初のコマで止める） */
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.querySelectorAll('video.idle').forEach(v => { v.autoplay = false; v.pause(); });
}
/* 動画が読めない場合はポスター画像で静止表示のまま（何もしなくてよい） */

renderIntro();
requestAnimationFrame(resize);
</script>
</body>
</html>
